# Available runners configured by board.cmake.
runners:
- nrfutil
- nrfjprog
- jlink

# Default flash runner if --runner is not given.
flash-runner: nrfutil

# Default debug runner if --runner is not given.
debug-runner: jlink

# Common runner configuration values.
config:
  board_dir: C:/ncs/v3.4.0/zephyr/boards/nordic/thingy53
  # Build outputs:
  elf_file: zephyr.elf
  hex_file: C:/Users/Javad/Videos/Zypher/zypher/l6/l6_e2_sol/build/l6_e2_sol/zephyr/zephyr.signed.hex
  bin_file: C:/Users/Javad/Videos/Zypher/zypher/l6/l6_e2_sol/build/l6_e2_sol/zephyr/zephyr.signed.bin
  # Host tools:
  gdb: C:/ncs/toolchains/dcbdc366a1/opt/zephyr-sdk/gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb-py.exe

# Runner specific arguments
args:
  nrfutil:
    - --ext-mem-config-file=C:/ncs/v3.4.0/zephyr/boards/nordic/thingy53/support/thingy53_qspi_nrfutil_config.json
  nrfjprog:
    []

  jlink:
    - --dt-flash=y
    - --device=nrf5340_xxaa_app
    - --speed=4000
